name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows-and-assets:
    name: Workflow and asset validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate JSON, XML, and app data references
        run: python scripts/check_project_data.py

      - name: Install actionlint
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash \
            --output "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$RUNNER_TEMP"

      - name: Check GitHub Actions syntax and expressions
        run: ${{ runner.temp }}/actionlint -color

  kotlin:
    name: Kotlin style and syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install ktlint
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/ktlint/ktlint/releases/download/1.8.0/ktlint \
            --output "$RUNNER_TEMP/ktlint"
          chmod +x "$RUNNER_TEMP/ktlint"

      - name: Check Kotlin source and Gradle Kotlin DSL formatting
        run: ${{ runner.temp }}/ktlint --relative

  rust:
    name: Rust format and static analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path app/src/main/rust/Cargo.toml --all -- --check

      - name: Fetch pinned runtime and sample assets
        run: |
          cargo fetch --manifest-path app/src/main/rust/Cargo.toml --locked
          MODEL="$(find "$HOME/.cargo/git/checkouts" -path '*/assets/models/Hiyori/Hiyori.model3.json' -print -quit)"
          test -n "$MODEL"
          echo "NEOCARI_TEST_MODEL=$MODEL" >> "$GITHUB_ENV"

      - name: Install Mesa for offscreen GLES regression tests
        run: sudo apt-get update && sudo apt-get install --yes libegl1-mesa-dev libgles2-mesa-dev

      - name: Run runtime regression tests
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: cargo test --manifest-path app/src/main/rust/Cargo.toml --locked -- --include-ignored

      - name: Run Clippy
        run: cargo clippy --manifest-path app/src/main/rust/Cargo.toml --locked --all-targets -- -D warnings

  android:
    name: Android ARMv8 build and unit tests
    runs-on: ubuntu-24.04
    needs: rust
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Check Android Rust code
        run: cargo clippy --manifest-path app/src/main/rust/Cargo.toml --target aarch64-linux-android --locked -- -D warnings

      - name: Prepare Zstd native library
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 \
            "https://repo1.maven.org/maven2/com/github/luben/zstd-jni/1.5.6-9/zstd-jni-1.5.6-9.aar" \
            --output "$RUNNER_TEMP/zstd.aar"
          unzip -p "$RUNNER_TEMP/zstd.aar" jni/arm64-v8a/libzstd-jni-1.5.6-9.so \
            > app/src/main/jniLibs/arm64-v8a/libzstd-jni-1.5.6-9.so

      - name: Build APK and run Kotlin unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: neocari-android-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
