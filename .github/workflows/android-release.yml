name: Android Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed ARMv8 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl unzip
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Prepare Live2D and native libraries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p third_party app/src/main/jniLibs/arm64-v8a
          git clone --depth 1 https://github.com/EasyLive2D/Live2D-v2-Lua.git \
            third_party/Live2D-v2-Lua

          git clone --depth 1 https://github.com/LuaJIT/LuaJIT.git "$RUNNER_TEMP/LuaJIT"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOL="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          make -C "$RUNNER_TEMP/LuaJIT" -j"$(nproc)" \
            HOST_CC=gcc \
            CROSS= \
            CC="$TOOL/aarch64-linux-android23-clang" \
            TARGET_AR="$TOOL/llvm-ar rcus" \
            TARGET_STRIP="$TOOL/llvm-strip" \
            TARGET_SYS=Linux \
            XCFLAGS="-DLUAJIT_ENABLE_GC64" \
            TARGET_SHLDFLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"

          cp "$RUNNER_TEMP/LuaJIT/src/libluajit.so" \
            app/src/main/jniLibs/arm64-v8a/libluajit.so

          curl --fail --location --retry 3 \
            "https://repo1.maven.org/maven2/com/github/luben/zstd-jni/1.5.6-9/zstd-jni-1.5.6-9.aar" \
            --output "$RUNNER_TEMP/zstd-jni-1.5.6-9.aar"
          unzip -p "$RUNNER_TEMP/zstd-jni-1.5.6-9.aar" \
            jni/arm64-v8a/libzstd-jni-1.5.6-9.so \
            > app/src/main/jniLibs/arm64-v8a/libzstd-jni-1.5.6-9.so

      # BANDORI_JKS (base64-encoded keystore) is configured as a repository secret.
      - name: Prepare release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.BANDORI_JKS }}
          RELEASE_STORE_PASSWORD: bandori123
          RELEASE_KEY_PASSWORD: bandori123
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_STORE_PASSWORD" || -z "$RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Configure the BANDORI_JKS repository secret (base64-encoded keystore)."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/bandori-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          {
            printf 'ORG_GRADLE_PROJECT_BANDORI_RELEASE_STORE_FILE=%s\n' "$KEYSTORE"
            printf 'ORG_GRADLE_PROJECT_BANDORI_RELEASE_STORE_PASSWORD=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'ORG_GRADLE_PROJECT_BANDORI_RELEASE_KEY_ALIAS=bandori\n'
            printf 'ORG_GRADLE_PROJECT_BANDORI_RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify and name APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"

          APK_NAME="Bandori-Pet-Android-v${VERSION}-ARMv8.apk"
          cp "$APK" "$RUNNER_TEMP/$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK for manual download
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.apk_name }}
          path: ${{ runner.temp }}/${{ steps.package.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          APK_NAME: ${{ steps.package.outputs.apk_name }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$APK_NAME" --clobber
